name: Update conference deadlines

on:
  schedule:
    - cron: '17 6 * * 0' # Sunday 06:17 UTC; preserves Copilot Free allowance
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: update-conferences
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch conferences and update README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m conference_tracker.update
      - name: Commit and push generated files
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/conferences.json data/conferences.csv data/conference_websites.json data/scraper_todos.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: refresh conference deadlines'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
